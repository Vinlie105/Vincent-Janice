<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vincent & Janice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: one soft column, hero countdown on top, rounded stacked cards, bottom tab bar. Pink first, then blue, white, red. */
:root{
  --bg:#FFF8F9; --fg:#1F3A5F; --muted:#586E8F; --card:#FCE4EA; --surface:#FFFFFF;
  --pink:#F4A7B9; --red:#D7263D; --blue:#D6E4F7; --line:#F2CBD5;
  --hero:#F4A7B9; --on-hero:#1F3A5F; --tile:#FFF8F9; --num:#D7263D;
  --btn:#D7263D; --on-btn:#FFFFFF; --shadow:rgba(215,38,61,.14); color-scheme:light;
  --display:'Caveat','Patrick Hand',cursive; --body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#151826; --fg:#F7E9EE; --muted:#B9AAC4; --card:#241F36; --surface:#2E2842;
  --pink:#E58FA6; --red:#FF6B7D; --blue:#2A3D63; --line:#3B3350;
  --hero:#4A2A47; --on-hero:#FCE4EA; --tile:#2E2442; --num:#FF8A98;
  --btn:#FF6B7D; --on-btn:#2B0A12; --shadow:rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151826; --fg:#F7E9EE; --muted:#B9AAC4; --card:#241F36; --surface:#2E2842;
  --pink:#E58FA6; --red:#FF6B7D; --blue:#2A3D63; --line:#3B3350;
  --hero:#4A2A47; --on-hero:#FCE4EA; --tile:#2E2442; --num:#FF8A98;
  --btn:#FF6B7D; --on-btn:#2B0A12; --shadow:rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:16px 100px;overflow-x:hidden}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--red);outline-offset:2px;border-radius:8px}
.hand{font-family:var(--display);font-weight:700;letter-spacing:.01em}
.label{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.tnum{font-variant-numeric:tabular-nums}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 2px 0}
.top-end{display:flex;flex-direction:column;align-items:center;gap:6px;flex:none}
.top h1{font-family:var(--display);font-size:42px;line-height:1;color:var(--fg);text-wrap:balance}
.top h1 .amp{color:var(--red)}
.cat{width:34px;height:34px;color:var(--fg);flex:none}

/* cards */
.card{background:var(--card);border-radius:22px;padding:16px;box-shadow:0 6px 18px var(--shadow);min-width:0}
.card.flat{box-shadow:none;border:2px dashed var(--line);background:transparent}
.hero{background:var(--hero);color:var(--on-hero);border-radius:30px 30px 30px 8px;padding:18px 16px 16px;position:relative;overflow:hidden;box-shadow:0 10px 26px var(--shadow)}
.hero .label{color:var(--on-hero);opacity:.85}
.hero h2{font-family:var(--display);font-size:32px;line-height:1.05;margin:2px 0 12px;text-wrap:balance}
.doodle{position:absolute;right:-12px;top:-14px;width:92px;height:92px;opacity:.35;color:var(--on-hero);pointer-events:none}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{background:var(--tile);border-radius:16px;padding:10px 4px 8px;text-align:center;min-width:0}
.tile b{display:block;font:800 28px/1.1 var(--body);color:var(--num);font-variant-numeric:tabular-nums}
.tile span{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--fg)}
.sub{margin-top:10px;font-weight:700}

.daycard{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:0;position:relative}
.daynum{font-family:var(--display);font-weight:700;font-size:76px;line-height:.9;color:var(--red)}
.daycard .txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.daycard .txt b{font-size:18px}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bday{background:var(--blue);border-radius:22px 22px 8px 22px;padding:14px;min-width:0}
.bday:nth-child(2){background:var(--card);border-radius:22px 22px 22px 8px}
.bday .n{font-family:var(--display);font-size:28px;line-height:1}
.bday .big{font-size:34px;font-weight:800;color:var(--red);line-height:1.1;font-variant-numeric:tabular-nums}
.bday.today{grid-column:1/-1;text-align:center;background:var(--pink);color:#1F3A5F}
.bday.today .n{font-size:40px}
.banner{background:var(--red);color:#fff;border-radius:18px;padding:12px 14px;font-weight:800;text-align:center}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .banner{color:#2B0A12}}
:root[data-theme="dark"] .banner{color:#2B0A12}

.clocks{display:flex;gap:10px}
.clock{flex:1;background:var(--surface);border-radius:16px;padding:10px 12px;min-width:0}
.clock b{display:block;font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--fg)}
.clock.me{outline:2px solid var(--pink)}

.note{background:var(--surface);border-radius:16px;padding:12px 14px}
.note p{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:4px;font-size:17px}
.note.mine{background:transparent;border:2px dashed var(--line)}
.stack{display:flex;flex-direction:column;gap:10px}
.sec-title{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:10px}
.sec-title h2{font-family:var(--display);font-size:30px;line-height:1}

/* buttons */
.btn{background:var(--btn);color:var(--on-btn);border:0;border-radius:999px;padding:10px 18px;font-weight:800;transition:transform .15s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--fg);border:2px solid var(--pink)}
.btn.small{padding:6px 12px;font-size:14px}
.icon-btn{background:var(--surface);border:0;border-radius:12px;width:36px;height:36px;display:grid;place-items:center;font-size:16px;flex:none}
.icon-btn.warn{background:var(--red);color:var(--on-btn);width:auto;padding:0 10px;font-size:13px;font-weight:800}

/* list rows */
.row{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:16px;padding:10px 12px;min-width:0}
.row .em{font-size:26px;flex:none;width:34px;text-align:center}
.row .mid{flex:1;min-width:0}
.row .mid b{display:block;overflow-wrap:anywhere}
.row .mid small{color:var(--muted);font-weight:600}
.row .when{font-weight:800;color:var(--red);font-variant-numeric:tabular-nums}
.row .acts{display:flex;gap:6px;flex:none}
.check{width:34px;height:34px;border-radius:50%;border:3px solid var(--pink);background:transparent;flex:none;display:grid;place-items:center;color:var(--on-btn);font-weight:800}
.check[aria-checked="true"]{background:var(--btn);border-color:var(--btn)}
.row.done .mid b{text-decoration:line-through;text-decoration-color:var(--pink);opacity:.75}
.bar{height:10px;background:var(--surface);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--red);border-radius:99px;transform-origin:left;transition:transform .5s}
details summary{cursor:pointer;font-weight:800;padding:6px 0}

/* sheet */
.sheet-back{position:fixed;inset:0;background:rgba(20,10,20,.5);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{background:var(--bg);color:var(--fg);width:100%;max-width:560px;border-radius:28px 28px 0 0;
  padding:18px max(16px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px));
  max-height:92%;overflow:auto;display:flex;flex-direction:column;gap:12px;animation:rise .25s ease-out}
.sheet h2{font-family:var(--display);font-size:32px;line-height:1}
.field{display:flex;flex-direction:column;gap:4px}
.field input,.field textarea{font:inherit;color:var(--fg);background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:10px 12px;width:100%;min-width:0}
.field textarea{min-height:110px;resize:vertical}
.emojis{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.emojis button{background:var(--surface);border:2px solid transparent;border-radius:12px;font-size:22px;height:40px}
.emojis button[aria-pressed="true"]{border-color:var(--red);background:var(--card)}
.seg{display:flex;gap:6px}
.seg button{flex:1;border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:8px;font-weight:800}
.seg button[aria-pressed="true"]{background:var(--btn);color:var(--on-btn);border-color:var(--btn)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btns{display:flex;gap:10px;justify-content:flex-end}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:2px solid var(--line);z-index:20;
  padding:6px max(16px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabs div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.tabs button{background:transparent;border:0;border-radius:14px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:0;font-size:12px;font-weight:800;color:var(--muted)}
.tabs button span{font-size:22px;line-height:1.2}
.tabs button[aria-current="page"]{background:var(--card);color:var(--red)}

/* gate */
.gate{min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center}
.gate h1{font-family:var(--display);font-size:54px;line-height:1}
.dots{display:flex;gap:12px;height:20px}
.dots i{width:16px;height:16px;border-radius:50%;border:3px solid var(--pink)}
.dots i.on{background:var(--red);border-color:var(--red)}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:12px}
.pad button{height:64px;border-radius:50%;border:0;background:var(--card);font:800 24px var(--body);color:var(--fg)}
.pad button:active{background:var(--pink)}
.shake{animation:shake .4s}
.who{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.who button{background:var(--card);border:3px solid var(--pink);border-radius:26px;padding:18px 26px;font-family:var(--display);font-size:34px;font-weight:700;color:var(--fg)}

.who button.guest{font-size:26px;border-style:dashed}
.who-note{max-width:300px;font-weight:600}
/* overlay + fx */
.here{position:fixed;inset:0;z-index:60;background:var(--hero);color:var(--on-hero);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px}
.here h2{font-family:var(--display);font-size:72px;line-height:1}
#fx{position:fixed;inset:0;pointer-events:none;z-index:80;overflow:hidden}
.bit{position:absolute;left:var(--x);top:var(--y);font-size:var(--s);animation:fly var(--t) ease-out forwards}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:700;z-index:90;max-width:90%}
.empty{text-align:center;padding:14px;color:var(--muted);font-weight:600}
.pill{display:inline-block;background:var(--surface);border-radius:999px;padding:2px 10px;font-size:13px;font-weight:700}
@keyframes rise{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes fly{0%{transform:translate(0,0) scale(.6);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--r)) scale(1);opacity:0}}
:root[data-motion="reduced"] *{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:360px){.tile b{font-size:22px}.daynum{font-size:60px}.pad{grid-template-columns:repeat(3,64px)}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="fx" aria-hidden="true"></div>
<div id="layer"></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function(){
'use strict';

/* ---------- config ---------- */
var AC=window.APP_CONFIG||{};
function bd(v){var q=String(v).split('-');return [+q[0],+q[1]]}
var CFG={
  names:AC.names||['Vincent','Janice'],
  start:String(AC.startDate||'2026-10-16').split('-').map(Number),
  bday:{Vincent:bd((AC.birthdays||{}).Vincent||'02-01'),Janice:bd((AC.birthdays||{}).Janice||'04-23')},
  arrive:Date.parse((AC.trip||{}).arrive||'2026-12-03T12:25:00+07:00'),
  leave:Date.parse((AC.trip||{}).leave||'2026-12-22T14:15:00+07:00'),
  tz:AC.timezones||{Vincent:'Asia/Singapore',Janice:'Asia/Jakarta'},
  tzOff:{SG:'+08:00',JKT:'+07:00'}
};
CFG.tripDays=Math.round((CFG.leave-CFG.arrive)/86400000);
var MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var EMOJIS=['🎂','✈️','🏠','🎉','💌','🎬','🍜','🌸','🐱','🎁','📅','🏖️','⛰️','🎤','🧋','❤️'];

/* ---------- helpers ---------- */
var store={
  get:function(k){try{return localStorage.getItem(k)}catch(e){return null}},
  set:function(k,v){try{localStorage.setItem(k,v)}catch(e){}},
  del:function(k){try{localStorage.removeItem(k)}catch(e){}}
};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function $(sel,root){return (root||document).querySelector(sel)}
function $$(sel,root){return Array.prototype.slice.call((root||document).querySelectorAll(sel))}
function dayIdx(y,m,d){return Math.round(Date.UTC(y,m-1,d)/86400000)}
var fmtCache={};
function ymd(ts,tz){
  var f=fmtCache['d'+tz]||(fmtCache['d'+tz]=new Intl.DateTimeFormat('en-CA',{timeZone:tz,year:'numeric',month:'2-digit',day:'2-digit'}));
  var o={};f.formatToParts(ts).forEach(function(p){o[p.type]=p.value});
  return [+o.year,+o.month,+o.day];
}
function clock(ts,tz){
  var f=fmtCache['c'+tz]||(fmtCache['c'+tz]=new Intl.DateTimeFormat('en-GB',{timeZone:tz,hour:'2-digit',minute:'2-digit',hourCycle:'h23'}));
  return f.format(ts);
}
function parts(ms){ms=Math.max(0,ms);var s=Math.floor(ms/1000);return {d:Math.floor(s/86400),h:Math.floor(s%86400/3600),m:Math.floor(s%3600/60),s:s%60}}
function plural(n,w){return n+' '+w+(n===1?'':'s')}
function rel(target){
  var ms=target-Date.now();
  if(ms<=0)return 'It happened';
  var p=parts(ms);
  if(p.d>0)return plural(p.d,'day')+' '+plural(p.h,'hr');
  if(p.h>0)return plural(p.h,'hr')+' '+plural(p.m,'min');
  return plural(p.m,'min')+' '+plural(p.s,'sec');
}
function ago(ts){
  var m=Math.floor((Date.now()-ts)/60000);
  if(m<1)return 'just now';
  if(m<60)return m+'m ago';
  if(m<1440)return Math.floor(m/60)+'h ago';
  return Math.floor(m/1440)+'d ago';
}
function shortDate(ts){return new Date(ts).toLocaleDateString('en-GB',{day:'numeric',month:'short',timeZone:'Asia/Jakarta'})}
function reduced(){return document.documentElement.dataset.motion==='reduced'}

/* ---------- state ---------- */
var S={
  db:null,dbState:'loading',booted:false,
  countdowns:[],plans:[],notes:[],
  passcode:'',
  me:store.get('vj_me'),
  tab:'home',editList:false,entered:'',
  rendered:'',confettiDone:{},dayAnimated:false
};
if(store.get('vj_motion')==='reduced')document.documentElement.dataset.motion='reduced';

function isUnlocked(){return !!S.passcode&&store.get('vj_pc')===S.passcode}
function myTz(){return CFG.tz[S.me]||'Asia/Singapore'}
function other(){return S.me==='Vincent'?'Janice':'Vincent'}

/* ---------- derived dates ---------- */
function today(){return ymd(Date.now(),'Asia/Jakarta')}
function todayIdx(){var t=today();return dayIdx(t[0],t[1],t[2])}
function startIdx(){return dayIdx(CFG.start[0],CFG.start[1],CFG.start[2])}
function dayNumber(){return todayIdx()-startIdx()+1}
function phase(){
  var n=Date.now();
  return n<CFG.arrive?'before':(n<CFG.leave?'during':'after');
}
function nextBirthday(name){
  var b=CFG.bday[name],t=today(),ti=todayIdx();
  var y=t[0],idx=dayIdx(y,b[0],b[1]);
  if(idx<ti){y+=1;idx=dayIdx(y,b[0],b[1])}
  return {diff:idx-ti,month:b[0],day:b[1],year:y};
}
function milestones(){
  var s=startIdx();
  return [
    {label:'1 month',idx:dayIdx(2026,11,16)},
    {label:'Day 50',idx:s+49},
    {label:'Day 100',idx:s+99},
    {label:'6 months',idx:dayIdx(2027,4,16)},
    {label:'1 year',idx:dayIdx(2027,10,16)}
  ];
}
function nextMilestone(){
  var ti=todayIdx(),m=milestones();
  for(var i=0;i<m.length;i++){if(m[i].idx>=ti)return {label:m[i].label,diff:m[i].idx-ti}}
  return null;
}
function upcoming(){
  var now=Date.now();
  return S.countdowns.filter(function(c){return c.ts>now}).sort(function(a,b){return a.ts-b.ts});
}
function pastCountdowns(){
  var now=Date.now();
  return S.countdowns.filter(function(c){return c.ts<=now}).sort(function(a,b){return b.ts-a.ts});
}

/* ---------- feedback ---------- */
function toast(msg){
  var t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=msg;
  document.body.appendChild(t);setTimeout(function(){t.remove()},2600);
}
function burst(symbols,n,ox,oy){
  if(reduced())return;
  var fx=$('#fx');
  for(var i=0;i<n;i++){
    var e=document.createElement('span');e.className='bit';
    e.textContent=symbols[i%symbols.length];
    var a=Math.random()*Math.PI*2,d=80+Math.random()*180;
    e.style.cssText='--x:'+(ox==null?Math.random()*100+'%':ox+'px')+';--y:'+(oy==null?'-10px':oy+'px')+
      ';--s:'+(16+Math.random()*16)+'px;--t:'+(1.4+Math.random()*1.2)+'s;--dx:'+(Math.cos(a)*d)+'px;--dy:'+(oy==null?(300+Math.random()*500):Math.sin(a)*d-60)+'px;--r:'+(Math.random()*360)+'deg';
    fx.appendChild(e);
    setTimeout(function(el){return function(){el.remove()}}(e),2800);
  }
}
function confetti(){burst(['🎉','💖','✨','🌸','🎊','🩷'],42)}

/* ---------- data (Supabase) ---------- */
var sb=null;
function uid(){try{return crypto.randomUUID()}catch(e){return 'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,8)}}
function guard(p,msg,table){
  var fail=function(){toast(msg||'Could not save. Check your connection and try again.');return null};
  return Promise.resolve(p).then(function(r){
    if(r&&r.error)return fail();
    if(table)load(table);
    return true;
  }).catch(fail);
}
var MAP={
  countdowns:function(r){return {id:r.id,title:r.title,emoji:r.emoji,datetime:r.datetime,date:r.date,time:r.time,tz:r.tz,addedBy:r.added_by,createdAt:r.created_at,ts:Date.parse(r.datetime)}},
  plans:function(r){return {id:r.id,title:r.title,emoji:r.emoji,done:r.done,doneBy:r.done_by,doneAt:r.done_at,addedBy:r.added_by,note:r.note,order:r.sort_order}},
  notes:function(r){return {id:r.id,text:r.body,from:r.from_name,createdAt:r.created_at}}
};
function applyRows(table,rows){
  if(table==='settings'){var pc=rows.filter(function(r){return r.key==='passcode'})[0];if(pc&&pc.value)S.passcode=String(pc.value);return}
  if(table==='countdowns')S.countdowns=rows.map(MAP.countdowns).filter(function(c){return !isNaN(c.ts)});
  if(table==='plans')S.plans=rows.map(MAP.plans).sort(function(a,b){return (a.order||0)-(b.order||0)});
  if(table==='notes')S.notes=rows.map(MAP.notes).sort(function(a,b){return b.createdAt-a.createdAt});
}
function load(table){
  return sb.from(table).select('*').then(function(res){
    if(res.error)throw res.error;
    applyRows(table,res.data||[]);
    S.dbState='ready';S.booted=true;render();
  }).catch(function(){
    if(S.dbState!=='ready')S.dbState='error';
    S.booted=true;render();
  });
}
var TABLES=['settings','countdowns','plans','notes'];
function connect(){
  var url=AC.supabaseUrl,key=AC.supabaseAnonKey;
  if(!window.supabase||!url||!key||/YOUR-/.test(key)){S.dbState='none';S.booted=true;render();return}
  sb=window.supabase.createClient(url,key);
  S.db=true;
  var slow=setTimeout(function(){if(S.dbState==='loading'){S.dbState='slow';render()}},10000);
  Promise.all(TABLES.map(load)).then(function(){clearTimeout(slow)});
  TABLES.forEach(function(t){
    sb.channel('rt-'+t).on('postgres_changes',{event:'*',schema:'public',table:t},function(){load(t)}).subscribe();
  });
  document.addEventListener('visibilitychange',function(){if(!document.hidden)TABLES.forEach(load)});
  setInterval(function(){if(!document.hidden)TABLES.forEach(load)},30000);
}

/* ---------- views ---------- */
function dhmsTiles(target){
  return '<div class="tiles" data-target="'+target+'">'+
    ['d:days','h:hrs','m:mins','s:secs'].map(function(u){var k=u.split(':');return '<div class="tile"><b data-unit="'+k[0]+'">0</b><span>'+k[1]+'</span></div>'}).join('')+'</div>';
}
function heroCard(){
  var ph=phase();
  if(ph==='before'){
    return '<section class="hero" aria-label="Countdown to meeting">'+FLOWER+'<p class="label">3 Dec · 12:25 WIB · CGK</p><h2>Until Vincent lands in Jakarta</h2>'+dhmsTiles(CFG.arrive)+'<p class="sub">Flight 8B 152 leaves Singapore at 11:40.</p></section>';
  }
  if(ph==='during'){
    var d=Math.min(CFG.tripDays,Math.floor((Date.now()-CFG.arrive)/86400000)+1);
    return '<section class="hero" aria-label="Together now">'+FLOWER+'<p class="label">Day '+d+' of '+CFG.tripDays+'</p><h2>Together now 🤍</h2><p class="label" style="margin-bottom:8px">Time left before he flies back</p>'+dhmsTiles(CFG.leave)+'<p class="sub">TR 309 departs CGK 22 Dec, 14:15.</p></section>';
  }
  var n=upcoming()[0];
  return '<section class="hero" aria-label="Until next time">'+FLOWER+'<h2>Until next time</h2>'+
    (n?'<p class="label">'+esc(n.emoji)+' '+esc(n.title)+'</p>'+dhmsTiles(n.ts):'<p class="sub">No countdown yet.</p><p style="margin-top:10px"><button class="btn" data-act="tab" data-v="countdowns">Add one</button></p>')+'</section>';
}
function dayCard(){
  var n=dayNumber();
  var big=n>=1?'<span class="daynum" id="daynum" data-n="'+n+'">'+n+'</span>':'<span class="daynum">'+Math.abs(n-1)+'</span>';
  var txt=n>=1?'<b>Day '+n+' of us</b><span class="muted">since “have we met before?”</span>':'<b>days until Day 1</b><span class="muted">16 Oct 2026</span>';
  return '<button class="card daycard" data-act="hearts" aria-label="Day counter, tap for hearts">'+big+'<span class="txt">'+txt+'</span></button>';
}
function bdayCards(){
  return '<div class="grid2">'+CFG.names.map(function(name){
    var b=nextBirthday(name);
    if(b.diff===0){
      return '<div class="bday today" data-bday="'+name+'"><p class="n hand">Happy Birthday '+name+'! 🎂</p></div>';
    }
    return '<div class="bday"><p class="label">'+name+'</p><p class="n">'+b.day+' '+MONTHS[b.month-1]+'</p><p class="big">'+b.diff+'</p><p class="muted" style="font-weight:700">'+(b.diff===1?'day':'days')+' to go</p></div>';
  }).join('')+'</div>';
}
function milestoneCard(){
  var m=nextMilestone();
  if(!m)return '';
  if(m.diff===0)return '<div class="banner">Happy '+esc(m.label)+' since “have we met before?” 🤍</div>';
  return '<div class="card"><p class="label">Next milestone</p><p style="font-size:20px;font-weight:800;margin-top:2px">'+esc(m.label)+' is in <span style="color:var(--red)">'+plural(m.diff,'day')+'</span></p></div>';

function clocksCard(){
  return '<div class="clocks">'+[['Singapore','Asia/Singapore','Vincent'],['Jakarta','Asia/Jakarta','Janice']].map(function(c){
    return '<div class="clock'+(S.me===c[2]?' me':'')+'"><span class="label">'+c[0]+(S.me===c[2]?' · you':'')+'</span><b data-clock="'+c[1]+'">'+clock(Date.now(),c[1])+'</b></div>';
  }).join('')+'</div>';

function latestNote(from){
  for(var i=0;i<S.notes.length;i++){if(S.notes[i].from===from)return S.notes[i]}
  return null;
}
function noteBlock(from){
  var n=latestNote(from),mine=from===S.me;
  if(!n)return '<div class="note mine"><span class="label">'+(mine?'You':esc(from))+'</span><p class="muted">'+(mine?'Nothing yet. Leave '+esc(other())+' a note.':esc(from)+' has not left a note yet.')+'</p></div>';
  return '<div class="note'+(mine?' mine':'')+'"><span class="label">'+(mine?'You left a note':esc(from)+' left you a note')+' · '+ago(n.createdAt)+'</span><p>'+esc(n.text)+'</p></div>';

function notesCard(){
  var hist=S.notes.filter(function(n){return n!==latestNote(n.from)});

    noteBlock(other())+noteBlock(S.me)+'</div>'+
    (hist.length?'<details style="margin-top:8px"><summary>Older notes ('+hist.length+')</summary><div class="stack">'+hist.slice(0,20).map(function(n){
      return '<div class="note"><span class="label">'+esc(n.from)+' · '+ago(n.createdAt)+'</span><p>'+esc(n.text)+'</p></div>'}).join('')+'</div></details>':'')+'</div>';

function miniCountdowns(){

function syncBanner(){
  if(S.dbState==='none')return '<div class="card flat"><b>Not syncing.</b> <span class="muted">The shared data is not connected yet. Check config.js.</span></div>';
  if(S.dbState==='slow')return '<div class="card flat muted">Still trying to reach the shared data. What you see may be out of date.</div>';
  if(S.dbState==='error')return '<div class="card flat muted">Could not load the shared data. Try refreshing.</div>';
  return '';
}

function hereOverlay(){

}

/* ---------- render ---------- */
function renderKey(){
  return [S.booted,isUnlocked(),S.me,phase(),dayNumber(),pastCountdowns().length,upcoming().length].join('|');
}
function render(){
  var app=$('#app');
  var ae=document.activeElement,keepId=ae&&ae.id&&app.contains(ae)?ae.id:null,keepVal=keepId?ae.value:null;
  if(!S.booted){app.innerHTML='<div class="gate"><h1>Vincent &amp; Janice</h1><p class="muted">Opening…</p></div>';return}
  if(!S.passcode){app.innerHTML='<div class="gate"><h1>Vincent &amp; Janice</h1><p class="muted">'+(S.dbState==='error'||S.dbState==='none'?'Can’t reach the shared data. Check your connection and refresh.':'Opening…')+'</p></div>';return}
  if(!isUnlocked()){app.innerHTML=gateView();return}
  if(!S.me){app.innerHTML=whoView();return}
  if(S.me==='Guest'){app.innerHTML=guestView();$('#layer').innerHTML='';S.rendered=renderKey();return}
  app.innerHTML=appView();
  $('#layer').innerHTML=hereOverlay();
  S.rendered=renderKey();
  tick();
  var n=$('#daynum');
  if(n&&!S.dayAnimated&&!reduced()){
    S.dayAnimated=true;var target=+n.dataset.n,t0=performance.now();
    (function step(t){var k=Math.min(1,(t-t0)/700);n.textContent=Math.round(target*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(step)})(t0);
  }else S.dayAnimated=true;
  if(keepId){var el=document.getElementById(keepId);if(el){el.value=keepVal;el.focus()}}
  $$('[data-bday]').forEach(function(b){
    if(!S.confettiDone[b.dataset.bday]){S.confettiDone[b.dataset.bday]=1;confetti()}
  });
  if($('.banner')&&!S.confettiDone.ms){S.confettiDone.ms=1;confetti()}
  if($('.here')&&!S.confettiDone.here){S.confettiDone.here=1;confetti()}
}
function tick(){
  if(!S.booted||!isUnlocked()||!S.me)return;
  if(renderKey()!==S.rendered){render();return}
  var now=Date.now();
  $$('.tiles[data-target]').forEach(function(t){
    var p=parts(+t.dataset.target-now);
    ['d','h','m','s'].forEach(function(u){var el=t.querySelector('[data-unit="'+u+'"]');var v=String(p[u]);if(el.textContent!==v)el.textContent=v});
  });
  $$('[data-rel]').forEach(function(e){e.textContent=rel(+e.dataset.rel)});
  $$('[data-clock]').forEach(function(e){e.textContent=clock(now,e.dataset.clock)});
}

/* ---------- sheets ---------- */
function closeSheet(){var s=$('.sheet-back');if(s)s.remove()}
function openSheet(html){
  closeSheet();
  var w=document.createElement('div');w.className='sheet-back';
  w.innerHTML='<div class="sheet" role="dialog" aria-modal="true">'+html+'</div>';
  w.addEventListener('click',function(e){if(e.target===w)closeSheet()});
  document.body.appendChild(w);
  var f=$('input,textarea',w);if(f)f.focus();
  return w;
}
function emojiGrid(sel){
  return '<div class="emojis" id="emojis" role="group" aria-label="Emoji">'+EMOJIS.map(function(e){return '<button type="button" data-act="pick-emoji" data-v="'+e+'" aria-pressed="'+(e===sel)+'">'+e+'</button>'}).join('')+'</div>';
}
function cdSheet(c){
  var edit=!!c,tz=edit?c.tz:(S.me==='Janice'?'JKT':'SG');
  var w=openSheet('<h2>'+(edit?'Edit countdown':'New countdown')+'</h2>'+
    '<div class="field"><label for="f-title">What are you counting down to?</label><input id="f-title" maxlength="60" value="'+esc(edit?c.title:'')+'"></div>'+
    emojiGrid(edit?c.emoji:'🎉')+
    '<div class="two"><div class="field"><label for="f-date">Date</label><input id="f-date" type="date" value="'+esc(edit?c.date:'')+'"></div><div class="field"><label for="f-time">Time (optional)</label><input id="f-time" type="time" value="'+esc(edit?c.time:'')+'"></div></div>'+
    '<div class="seg" role="group" aria-label="Timezone"><button type="button" data-act="pick-tz" data-v="SG" aria-pressed="'+(tz==='SG')+'">Singapore</button><button type="button" data-act="pick-tz" data-v="JKT" aria-pressed="'+(tz==='JKT')+'">Jakarta</button></div>'+

function planSheet(p){

  var w=openSheet('<h2>Note for '+esc(other())+'</h2><div class="field"><label for="f-note" class="muted">Up to 280 characters</label><textarea id="f-note" maxlength="280"></textarea><span class="muted" id="cnt" style="text-align:right">0 / 280</span></div>'+
    '<div class="btns"><button class="btn ghost" data-act="close">Cancel</button><button class="btn" data-act="save-note">Send</button></div>');
  $('#f-note',w).addEventListener('input',function(e){$('#cnt',w).textContent=e.target.value.length+' / 280'});

/* ---------- actions ---------- */
function savePlanOrder(a,b){
  if(!a||!b)return Promise.resolve();
  return guard(sb.from('plans').update({sort_order:b.order}).eq('id',a.id)).then(function(){return guard(sb.from('plans').update({sort_order:a.order}).eq('id',b.id),null,'plans')});
}
function getById(list,id){return list.filter(function(x){return x.id===id})[0]}
var confirmTimers={};
var actions={
  tab:function(el){S.tab=el.dataset.v;S.editList=false;render();window.scrollTo(0,0)},
  hearts:function(el){var r=el.getBoundingClientRect();burst(['💖','🩷','❤️','💗'],10,r.left+60,r.top+30)},
  key:function(el){
    var k=el.dataset.v;
    if(k==='⌫')S.entered=S.entered.slice(0,-1);else S.entered+=k;
    if(S.entered.length>=S.passcode.length){
      if(S.entered===S.passcode){store.set('vj_pc',S.passcode);S.entered='';render()}
      else{S.entered='';render();var d=$('#dots');if(d){d.classList.add('shake');setTimeout(function(){d.classList.remove('shake')},400)}}
    }else render();
  },
  who:function(el){S.me=el.dataset.v;store.set('vj_me',S.me);render()},
  switch:function(){S.me=null;store.del('vj_me');render()},
  logout:function(){store.del('vj_pc');store.del('vj_me');S.me=null;S.entered='';S.tab='home';S.editList=false;render();window.scrollTo(0,0)},
  motion:function(){
    if(reduced()){delete document.documentElement.dataset.motion;store.set('vj_motion','')}
    else{document.documentElement.dataset.motion='reduced';store.set('vj_motion','reduced')}
    render();
  },
  savepc:function(){
    var v=$('#newpc').value.trim();
    if(!/^\d{4,6}$/.test(v)){toast('Use 4 to 6 digits.');return}
    guard(sb.from('settings').upsert({key:'passcode',value:v})).then(function(r){
      if(r!==null){store.set('vj_pc',v);S.passcode=v;toast('Passcode changed. Tell '+other()+'.');render()}
    });
  },
  here:function(){store.set('vj_here','1');$('#layer').innerHTML=''},
  close:closeSheet,
  'pick-emoji':function(el){
    var w=$('.sheet-back');w.dataset.emoji=el.dataset.v;
    $$('#emojis button').forEach(function(b){b.setAttribute('aria-pressed',String(b===el))});
  },
  'pick-tz':function(el){
    var w=$('.sheet-back');w.dataset.tz=el.dataset.v;
    $$('[data-act="pick-tz"]').forEach(function(b){b.setAttribute('aria-pressed',String(b===el))});
  },
  'add-cd':function(){cdSheet(null)},
  'edit-cd':function(el){cdSheet(getById(S.countdowns,el.dataset.id))},
  'save-cd':function(el){
    var w=$('.sheet-back'),title=$('#f-title').value.trim(),date=$('#f-date').value,time=$('#f-time').value;
    if(!title||!date){toast('Add a title and a date.');return}
    var tz=w.dataset.tz,iso=date+'T'+(time||'00:00')+':00'+CFG.tzOff[tz];
    if(isNaN(Date.parse(iso))){toast('That date does not look right.');return}
    var id=el.dataset.id,old=id?getById(S.countdowns,id):null;
    guard(sb.from('countdowns').upsert({id:id||uid(),title:title,emoji:w.dataset.emoji,datetime:iso,date:date,time:time,tz:tz,added_by:old?old.addedBy:S.me,created_at:old?old.createdAt:Date.now()}),null,'countdowns').then(function(r){if(r!==null)closeSheet()});
  },
  'add-plan':function(){planSheet(null)},
  'edit-plan':function(el){planSheet(getById(S.plans,el.dataset.id))},
  'save-plan':function(el){
    var w=$('.sheet-back'),title=$('#f-title').value.trim(),note=$('#f-note').value.trim();
    if(!title){toast('Give it a title.');return}
    var id=el.dataset.id,old=id?getById(S.plans,id):null;
    var maxOrder=S.plans.reduce(function(m,p){return Math.max(m,p.order||0)},0);
    var body=old?old:{done:false,doneBy:null,doneAt:null,addedBy:S.me,order:maxOrder+1};
    guard(sb.from('plans').upsert({id:id||uid(),title:title,emoji:w.dataset.emoji,note:note,done:!!body.done,done_by:body.doneBy,done_at:body.doneAt,added_by:body.addedBy,sort_order:body.order}),null,'plans').then(function(r){if(r!==null)closeSheet()});
  },
  tick:function(el){
    var p=getById(S.plans,el.dataset.id);if(!p||!S.db)return;
    var done=!p.done;
    guard(sb.from('plans').update({done:done,done_by:done?S.me:null,done_at:done?Date.now():null}).eq('id',p.id),null,'plans').then(function(){if(done)burst(['💖','✨'],8,el.getBoundingClientRect().left+17,el.getBoundingClientRect().top)});
  },
  'toggle-edit':function(){S.editList=!S.editList;render()},
  up:function(el){var i=S.plans.findIndex(function(p){return p.id===el.dataset.id});if(i>0)savePlanOrder(S.plans[i],S.plans[i-1])},
  down:function(el){var i=S.plans.findIndex(function(p){return p.id===el.dataset.id});if(i>=0&&i<S.plans.length-1)savePlanOrder(S.plans[i],S.plans[i+1])},
  del:function(el){
    var key=el.dataset.col+el.dataset.id;
    if(!el.classList.contains('warn')){
      el.classList.add('warn');el.textContent='Delete?';
      clearTimeout(confirmTimers[key]);confirmTimers[key]=setTimeout(function(){render()},3000);
      return;
    }
    clearTimeout(confirmTimers[key]);
    guard(sb.from(el.dataset.col).delete().eq('id',el.dataset.id),null,el.dataset.col);
  },
  note:function(){noteSheet()},
  'save-note':function(){
    var t=$('#f-note').value.trim();
    if(!t){toast('Write something first.');return}
    guard(sb.from('notes').insert({id:uid(),body:t.slice(0,280),from_name:S.me,created_at:Date.now()}),null,'notes').then(function(r){if(r){closeSheet();toast('Note sent 💌')}});
  }
};
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');
  if(!el||el.disabled)return;
  var fn=actions[el.dataset.act];
  if(fn)fn(el);
});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeSheet()});

/* ---------- boot ---------- */
render();
setInterval(tick,1000);
connect();
})();
</script>
</body>
</html>
