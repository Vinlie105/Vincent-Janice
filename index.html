<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://fpfeswlsyxqsslqpgbph.supabase.co wss://fpfeswlsyxqsslqpgbph.supabase.co; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vincent & Janice</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#FF77AD">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="V&amp;J">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: one soft column, hero countdown on top, rounded stacked cards, bottom tab bar. Pink first, then blue, white, red. */
:root{
  --bg:#FFE3EE; --fg:#1F3A5F; --muted:#3F5679; --card:#FFC2D9; --surface:#FFFFFF;
  --pink:#FF4F93; --red:#D90F5C; --blue:#BFDDFF; --line:#FF9CC2;
  --hero:#FF77AD; --on-hero:#1F3A5F; --tile:#FFF0F6; --num:#D90F5C;
  --btn:#D90F5C; --on-btn:#FFFFFF; --shadow:rgba(255,60,130,.35); color-scheme:light;
  --display:'Caveat','Patrick Hand',cursive; --body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1D1230; --fg:#FFEFF5; --muted:#D3BFDD; --card:#3D1F5C; --surface:#4A2D6B;
  --pink:#FF5FA2; --red:#FF5C8D; --blue:#2F4A7A; --line:#6A3A85;
  --hero:#A8337F; --on-hero:#FFF0F6; --tile:#4A2D6B; --num:#FFA3C4;
  --btn:#FF6B8B; --on-btn:#2B0A12; --shadow:rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1D1230; --fg:#FFEFF5; --muted:#D3BFDD; --card:#3D1F5C; --surface:#4A2D6B;
  --pink:#FF5FA2; --red:#FF5C8D; --blue:#2F4A7A; --line:#6A3A85;
  --hero:#A8337F; --on-hero:#FFF0F6; --tile:#4A2D6B; --num:#FFA3C4;
  --btn:#FF6B8B; --on-btn:#2B0A12; --shadow:rgba(0,0,0,.4); color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:max(16px,env(safe-area-inset-top,0px));padding-bottom:100px;overflow-x:hidden}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--red);outline-offset:2px;border-radius:8px}
.hand{font-family:var(--display);font-weight:700;letter-spacing:.01em}
.label{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.tnum{font-variant-numeric:tabular-nums}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 2px 0}
.top-end{display:flex;flex-direction:column;align-items:center;gap:6px;flex:none}
.top h1{font-family:var(--display);font-size:42px;line-height:1;color:var(--fg);text-wrap:balance}
.top h1 .amp{color:var(--red)}
.cat{width:34px;height:34px;color:var(--fg);flex:none}

/* cards */
.card{background:var(--card);border-radius:22px;padding:16px;box-shadow:0 6px 18px var(--shadow);min-width:0}
.card.flat{box-shadow:none;border:2px dashed var(--line);background:transparent}
.hero{background:var(--hero);color:var(--on-hero);border-radius:30px 30px 30px 8px;padding:18px 16px 16px;position:relative;overflow:hidden;box-shadow:0 10px 26px var(--shadow)}
.hero .label{color:var(--on-hero);opacity:.85}
.hero h2{font-family:var(--display);font-size:32px;line-height:1.05;margin:2px 0 12px;text-wrap:balance}
.doodle{position:absolute;right:-12px;top:-14px;width:92px;height:92px;opacity:.35;color:var(--on-hero);pointer-events:none}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{background:var(--tile);border-radius:16px;padding:10px 4px 8px;text-align:center;min-width:0}
.tile b{display:block;font:800 28px/1.1 var(--body);color:var(--num);font-variant-numeric:tabular-nums}
.tile span{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--fg)}
.sub{margin-top:10px;font-weight:700}

.daycard{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:0;position:relative}
.daynum{font-family:var(--display);font-weight:700;font-size:76px;line-height:.9;color:var(--red)}
.daycard .txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.daycard .txt b{font-size:18px}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bday{background:var(--blue);border-radius:22px 22px 8px 22px;padding:14px;min-width:0}
.bday:nth-child(2){background:var(--card);border-radius:22px 22px 22px 8px}
.bday .n{font-family:var(--display);font-size:28px;line-height:1}
.bday .big{font-size:34px;font-weight:800;color:var(--red);line-height:1.1;font-variant-numeric:tabular-nums}
.bday.today{grid-column:1/-1;text-align:center;background:var(--pink);color:#1F3A5F}
.bday.today .n{font-size:40px}
.banner{background:var(--red);color:#fff;border-radius:18px;padding:12px 14px;font-weight:800;text-align:center}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .banner{color:#2B0A12}}
:root[data-theme="dark"] .banner{color:#2B0A12}

.clocks{display:flex;gap:10px}
.clock{flex:1;background:var(--surface);border-radius:16px;padding:10px 12px;min-width:0}
.clock b{display:block;font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--fg)}
.clock.me{outline:2px solid var(--pink)}

.note{background:var(--surface);border-radius:16px;padding:12px 14px}
.note p{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:4px;font-size:17px}
.note.mine{background:transparent;border:2px dashed var(--line)}
.stack{display:flex;flex-direction:column;gap:10px}
.sec-title{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:10px}
.sec-title h2{font-family:var(--display);font-size:30px;line-height:1}

/* buttons */
.btn{background:var(--btn);color:var(--on-btn);border:0;border-radius:999px;padding:10px 18px;font-weight:800;transition:transform .15s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--fg);border:2px solid var(--pink)}
.btn.small{padding:6px 12px;font-size:14px}
.icon-btn{background:var(--surface);border:0;border-radius:12px;width:36px;height:36px;display:grid;place-items:center;font-size:16px;flex:none}
.icon-btn.warn{background:var(--red);color:var(--on-btn);width:auto;padding:0 10px;font-size:13px;font-weight:800}

/* list rows */
.row{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:16px;padding:10px 12px;min-width:0}
.row .em{font-size:26px;flex:none;width:34px;text-align:center}
.row .mid{flex:1;min-width:0}
.row .mid b{display:block;overflow-wrap:anywhere}
.row .mid small{color:var(--muted);font-weight:600}
.row .when{font-weight:800;color:var(--red);font-variant-numeric:tabular-nums}
.row .acts{display:flex;gap:6px;flex:none}
.check{width:34px;height:34px;border-radius:50%;border:3px solid var(--pink);background:transparent;flex:none;display:grid;place-items:center;color:var(--on-btn);font-weight:800}
.check[aria-checked="true"]{background:var(--btn);border-color:var(--btn)}
.row.done .mid b{text-decoration:line-through;text-decoration-color:var(--pink);opacity:.75}
.bar{height:10px;background:var(--surface);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--red);border-radius:99px;transform-origin:left;transition:transform .5s}
details summary{cursor:pointer;font-weight:800;padding:6px 0}

/* sheet */
.sheet-back{position:fixed;inset:0;background:rgba(20,10,20,.5);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{background:var(--bg);color:var(--fg);width:100%;max-width:560px;border-radius:28px 28px 0 0;
  padding:18px max(16px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px));
  max-height:92%;overflow:auto;display:flex;flex-direction:column;gap:12px;animation:rise .25s ease-out}
.sheet h2{font-family:var(--display);font-size:32px;line-height:1}
.field{display:flex;flex-direction:column;gap:4px}
.field input,.field textarea{font:inherit;color:var(--fg);background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:10px 12px;width:100%;min-width:0}
.field textarea{min-height:110px;resize:vertical}
.emojis{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.emojis button{background:var(--surface);border:2px solid transparent;border-radius:12px;font-size:22px;height:40px}
.emojis button[aria-pressed="true"]{border-color:var(--red);background:var(--card)}
.seg{display:flex;gap:6px}
.seg button{flex:1;border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:8px;font-weight:800}
.seg button[aria-pressed="true"]{background:var(--btn);color:var(--on-btn);border-color:var(--btn)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btns{display:flex;gap:10px;justify-content:flex-end}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:2px solid var(--line);z-index:20;
  padding:6px max(16px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabs div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);gap:2px}
.tabs button{background:transparent;border:0;border-radius:14px;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:0;font-size:11px;font-weight:800;color:var(--muted);min-width:0;white-space:nowrap}
.tabs button span{font-size:22px;line-height:1.2}
.tabs button[aria-current="page"]{background:var(--card);color:var(--red)}

/* gate */
.gate{min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center}
.gate h1{font-family:var(--display);font-size:54px;line-height:1}
.dots{display:flex;gap:12px;height:20px}
.dots i{width:16px;height:16px;border-radius:50%;border:3px solid var(--pink)}
.dots i.on{background:var(--red);border-color:var(--red)}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:12px}
.pad button{height:64px;border-radius:50%;border:0;background:var(--card);font:800 24px var(--body);color:var(--fg)}
.pad button:active{background:var(--pink)}
.shake{animation:shake .4s}
.who{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.who button{background:var(--card);border:3px solid var(--pink);border-radius:26px;padding:18px 26px;font-family:var(--display);font-size:34px;font-weight:700;color:var(--fg)}

.ci-row{display:flex;flex-direction:column;gap:8px;background:var(--surface);border-radius:16px;padding:10px 12px}
.ci-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.ci-top b{font-family:var(--display);font-size:26px;line-height:1}
.ci-top span{font-weight:700;color:var(--muted);font-size:14px}
.ci-dots{display:flex;gap:4px}
.ci-dots i{flex:1;height:16px;border-radius:6px;background:var(--line);opacity:.55}
.ci-dots i.on{background:var(--red);opacity:1}
.ci-dots i.today{outline:2px solid var(--fg);outline-offset:1px}
.pop-back{position:fixed;inset:0;background:rgba(40,10,30,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:70}
.pop{background:var(--bg);color:var(--fg);width:100%;max-width:420px;border-radius:28px;padding:22px;display:flex;flex-direction:column;gap:12px;text-align:center;box-shadow:0 14px 40px var(--shadow);animation:rise .25s ease-out}
.pop h2{font-family:var(--display);font-size:38px;line-height:1}
.pop .note{text-align:left}
.pop .btns{justify-content:center;flex-wrap:wrap}
.mood{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.mood button{height:48px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font:800 20px var(--body);color:var(--fg)}
.mood button[aria-pressed="true"]{background:var(--btn);color:var(--on-btn);border-color:var(--btn)}
.pop input{font:inherit;color:var(--fg);background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:10px 12px;width:100%;min-width:0}
.bigmood{font:800 64px/1 var(--body);color:var(--num)}
.mood button{font-size:30px}
.ci-note{font-weight:600;overflow-wrap:anywhere}
.c4{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;background:var(--blue);padding:10px;border-radius:22px;box-shadow:0 6px 18px var(--shadow)}
.c4 .col{display:flex;flex-direction:column;gap:6px;border:0;background:transparent;padding:0;border-radius:12px;min-width:0}
.c4 .col:not(:disabled):hover{background:rgba(255,255,255,.35)}
.c4 .col:disabled{cursor:default}
.disc{display:block;width:100%;aspect-ratio:1;border-radius:50%;background:var(--surface)}
.disc.v{background:#4C8DFF;box-shadow:inset 0 0 0 3px rgba(255,255,255,.55)}
.disc.j{background:#FF4F93;box-shadow:inset 0 0 0 3px rgba(255,255,255,.55)}
.disc.win{outline:4px solid var(--fg);outline-offset:1px}
.score{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;text-align:center}
.score .box{background:var(--surface);border-radius:16px;padding:8px}
.score .box b{display:block;font:800 30px/1.1 var(--body);color:var(--num)}
.status{font-family:var(--display);font-size:32px;line-height:1.05;text-align:center;text-wrap:balance}
.key{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-2px;margin-right:4px}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.menu button{border:0;text-align:left;background:var(--card);border-radius:22px;padding:14px;box-shadow:0 6px 18px var(--shadow);display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-width:0;color:var(--fg)}
.menu button .e{font-size:30px;line-height:1}
.menu button b{font-family:var(--display);font-size:27px;line-height:1.05}
.menu button .d{font-size:13px;font-weight:600;color:var(--muted)}
.menu button.wide{grid-column:1/-1;background:var(--hero);color:var(--on-hero)}
.menu button.wide .d{color:var(--on-hero)}
.qcard{background:var(--card);border-radius:28px;padding:22px 18px;text-align:center;display:flex;flex-direction:column;gap:12px;box-shadow:0 8px 22px var(--shadow);min-width:0}
.qcard .q{font-family:var(--display);font-size:34px;line-height:1.12;font-weight:700;text-wrap:balance;overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:800;color:var(--fg)}
.chips button[aria-pressed="true"]{background:var(--btn);color:var(--on-btn);border-color:var(--btn)}
.blur{filter:blur(9px);user-select:none}
.ans{background:var(--surface);border-radius:16px;padding:12px;font-weight:700;font-size:20px;overflow-wrap:anywhere}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choice button{border:3px solid var(--line);background:var(--surface);border-radius:22px;padding:22px 10px;font-family:var(--display);font-size:30px;line-height:1.1;color:var(--fg);min-width:0;overflow-wrap:anywhere}
.choice button[aria-pressed="true"]{background:var(--btn);color:var(--on-btn);border-color:var(--btn)}
.count{font:800 90px/1 var(--body);color:var(--num)}
.fp{font-size:12px;font-weight:800;letter-spacing:.06em;color:var(--muted)}
.cg-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn:disabled,.choice button:disabled{opacity:.55;cursor:default}
.field select{font:inherit;color:var(--fg);background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:10px 12px;width:100%}
.note-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.note .acts{display:flex;gap:6px;flex:none}
.note .icon-btn{background:var(--card);width:30px;height:30px;font-size:14px}
.note .icon-btn.warn{background:var(--btn);width:auto;font-size:13px}
.who-note{max-width:300px;font-weight:600}
/* overlay + fx */
.here{position:fixed;inset:0;z-index:60;background:var(--hero);color:var(--on-hero);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px}
.here h2{font-family:var(--display);font-size:72px;line-height:1}
#fx{position:fixed;inset:0;pointer-events:none;z-index:80;overflow:hidden}
.bit{position:absolute;left:var(--x);top:var(--y);font-size:var(--s);animation:fly var(--t) ease-out forwards}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:700;z-index:90;max-width:90%}
.empty{text-align:center;padding:14px;color:var(--muted);font-weight:600}
.pill{display:inline-block;background:var(--surface);border-radius:999px;padding:2px 10px;font-size:13px;font-weight:700}
@keyframes rise{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes fly{0%{transform:translate(0,0) scale(.6);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--r)) scale(1);opacity:0}}
/* motion: every rule below is switched off by the reduced-motion rules that follow */
.mood button{transition:transform .15s,background .15s,border-color .15s}
.mood button:active{transform:scale(.9)}
.mood button[aria-pressed="true"]{transform:scale(1.08);animation:moodpop .5s cubic-bezier(.3,1.6,.5,1)}
.bigmood{animation:moodpop .6s cubic-bezier(.3,1.6,.5,1) both}
.enter>*:not(.tabs){animation-name:enterIn;animation-duration:.5s;animation-timing-function:cubic-bezier(.2,.7,.2,1);animation-fill-mode:both;animation-delay:calc(var(--d,0s) - var(--el,0s))}
.enter>:nth-child(2){--d:.05s}.enter>:nth-child(3){--d:.1s}.enter>:nth-child(4){--d:.15s}.enter>:nth-child(5){--d:.2s}
.enter>:nth-child(6){--d:.25s}.enter>:nth-child(7){--d:.3s}.enter>:nth-child(8){--d:.35s}.enter>:nth-child(9){--d:.4s}
.enter>:nth-child(10){--d:.45s}.enter>:nth-child(11){--d:.5s}.enter>:nth-child(12){--d:.55s}.enter>:nth-child(n+13){--d:.6s}
.tile b.flip{animation:numtick .45s ease-out}
.c4{overflow:hidden}
.disc.drop{animation:discdrop calc(.35s + var(--n,1)*.06s) both}
.disc.win.pulse{animation:winpulse .8s ease-in-out 3}
.disc.win.pulse.drop{animation:discdrop calc(.35s + var(--n,1)*.06s) both,winpulse .8s ease-in-out calc(.45s + var(--n,1)*.06s) 3}
.check{transition:transform .15s,background .15s}
.check.pop{animation:checkpop .45s cubic-bezier(.3,1.6,.5,1)}
.check svg path{stroke-dasharray:1;stroke-dashoffset:0}
.check.pop svg path{animation:checkdraw .35s .08s ease-out both}
.pingpulse{position:absolute;inset:0;background:radial-gradient(circle at 50% 55%,rgba(255,79,147,.5),rgba(255,79,147,0) 65%);animation:pingpulse 1.8s ease-out forwards}
.bigheart{position:absolute;left:50%;top:50%;margin:-.55em 0 0 -.55em;font-size:96px;line-height:1;animation:heartbeat 1.8s ease-out forwards}
.floatup{position:absolute;left:var(--x);top:var(--y);font-size:30px;line-height:1;animation:floatup 1.7s ease-out var(--w,0s) both}
@keyframes moodpop{0%{transform:scale(.7)}55%{transform:scale(1.35) rotate(-6deg)}100%{transform:scale(1.08)}}
@keyframes enterIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes numtick{from{transform:translateY(-40%);opacity:.15}to{transform:none;opacity:1}}
@keyframes discdrop{0%{transform:translateY(calc(var(--n,1)*(-100% - 6px)));animation-timing-function:cubic-bezier(.5,0,.9,.6)}62%{transform:none;animation-timing-function:ease-out}78%{transform:translateY(-12%)}100%{transform:none}}
@keyframes winpulse{50%{transform:scale(1.14)}}
@keyframes checkpop{0%{transform:scale(.7)}60%{transform:scale(1.25)}100%{transform:none}}
@keyframes checkdraw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes pingpulse{0%{opacity:0;transform:scale(.6)}25%{opacity:1}100%{opacity:0;transform:scale(1.4)}}
@keyframes heartbeat{0%{transform:scale(.3);opacity:0}20%{transform:scale(1.2);opacity:1}32%{transform:scale(.95)}46%{transform:scale(1.15)}60%{transform:scale(1)}100%{transform:translateY(-50px) scale(1);opacity:0}}
@keyframes floatup{0%{transform:translate(-50%,0) scale(.5);opacity:0}15%{opacity:1}100%{transform:translate(calc(-50% + var(--sx,0px)),-170px) scale(1.2);opacity:0}}
.intro{position:fixed;inset:0;z-index:100;overflow:hidden;background:radial-gradient(circle at 50% 45%,var(--bg) 0%,var(--card) 100%);animation:introOut .6s ease-in 2s forwards}
.intro .fl{position:absolute;left:var(--x);top:var(--y);width:var(--s);height:var(--s);margin:calc(var(--s)/-2) 0 0 calc(var(--s)/-2);animation:bloom .9s cubic-bezier(.3,1.5,.5,1) var(--d) both}
.intro .fl svg{width:100%;height:100%;display:block;animation:flsway 3s ease-in-out var(--d) both}
.intro .hi{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--bg);color:var(--fg);border-radius:28px;padding:14px 26px;font-family:var(--display);font-weight:700;font-size:44px;line-height:1.05;text-align:center;box-shadow:0 10px 30px var(--shadow);max-width:86%;animation:hiIn .7s cubic-bezier(.3,1.4,.5,1) .55s both}
@keyframes bloom{from{transform:scale(0) rotate(-120deg);opacity:0}to{transform:scale(1) rotate(var(--r));opacity:1}}
@keyframes flsway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
@keyframes hiIn{from{transform:translate(-50%,-30%) scale(.7);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
@keyframes introOut{to{opacity:0;transform:scale(1.08)}}
:root[data-motion="reduced"] *{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* quiet "new version is ready" bar */
#upd{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;align-items:center;gap:10px;background:var(--card);color:var(--fg);border:2px solid var(--line);border-radius:22px;padding:8px 8px 8px 16px;font-weight:700;font-size:14px;line-height:1.3;box-shadow:0 6px 18px var(--shadow);width:max-content;max-width:calc(100vw - 32px);animation:updIn .4s ease both}
#upd span{min-width:0;overflow-wrap:anywhere}
#upd .btn{flex:none}
@keyframes updIn{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}
/* Open When letters */
.env-pink{--env:#FF9CC2;--env-dark:#E8326E;--env-light:#FFD6E6;--ink:#5B1038}
.env-red{--env:#E8326E;--env-dark:#B40F4C;--env-light:#F4749F;--ink:#FFFFFF}
.env-blue{--env:#BFDDFF;--env-dark:#7FB2EE;--env-light:#E3F0FF;--ink:#1F3A5F}
.env-white{--env:#FFFFFF;--env-dark:#D7D7E4;--env-light:#F4F4F9;--ink:#1F3A5F}
.shelf{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.env-wrap{position:relative;min-width:0}
.env-wrap .acts{position:absolute;top:6px;right:6px;display:flex;gap:6px}
.env-wrap .icon-btn{width:30px;height:30px;font-size:14px}
.env{width:100%;border:0;border-radius:18px;padding:14px 10px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;background:var(--env);color:var(--ink);box-shadow:0 6px 14px var(--shadow);transition:transform .15s}
.env:active{transform:scale(.97)}
.env.env-white{border:2px solid var(--line)}
.env.locked{filter:saturate(.75)}
.env-art{width:72px;display:block}
.env-art svg,.rv-env svg{width:100%;height:auto;display:block;overflow:visible}
.env-label{font-size:15px;line-height:1.2;overflow-wrap:anywhere}
.env-sub{font-weight:700;opacity:.85}
.env .e-body,.rv-env .e-body{fill:var(--env-light);stroke:var(--ink);stroke-width:2.5}
.env .e-flap,.rv-env .e-flap{fill:var(--env-dark);stroke:var(--ink);stroke-width:2.5}
.env .e-paper,.rv-env .e-paper{fill:#fff;stroke:var(--ink);stroke-width:2}
.env .e-line,.rv-env .e-line{stroke:var(--ink)}
.reveal{display:flex;flex-direction:column;align-items:center;width:100%}
.rv-env{width:120px;display:block;position:relative;z-index:1}
.paper{background:var(--surface);color:var(--fg);border-radius:18px;padding:14px;width:100%;margin-top:-10px;box-shadow:0 8px 22px var(--shadow);text-align:left}
.paper h2{margin:2px 0 8px}
.paper .note{max-height:42vh;overflow:auto;background:transparent;padding:0}
.reveal.anim .rv-env .e-flap{transform-box:fill-box;transform-origin:50% 100%;animation:flapOpen .5s ease both}
.reveal.anim .paper{animation:paperIn .6s .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes flapOpen{from{transform:scaleY(-1)}to{transform:scaleY(1)}}
@keyframes paperIn{from{opacity:0;transform:translateY(-44px) scale(.9)}to{opacity:1;transform:none}}
.swatches{display:flex;gap:12px;align-items:center}
.sw{width:38px;height:38px;border-radius:50%;border:3px solid var(--line);padding:0}
.sw[aria-pressed="true"]{border-color:var(--fg);box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--fg)}
.sw-pink{background:#FF9CC2}.sw-red{background:#E8326E}.sw-blue{background:#BFDDFF}.sw-white{background:#FFFFFF}
@media (max-width:360px){.tabs button{font-size:10px}.shelf{gap:8px}}
@media (max-width:360px){.tile b{font-size:22px}.daynum{font-size:60px}.pad{grid-template-columns:repeat(3,64px)}}
</style>
